version: "2"

linters:
  default: standard
  enable:
    - gosec
    - revive

  settings:
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: unused-parameter
        - name: indent-error-flow
        - name: range-val-in-closure

formatters:
  enable:
    - gofmt
    - goimports
