# SonarQube analysis for the GitLab pipeline (see .gitlab-ci.yml).
# The server URL and token come from CI variables, never from this file.
sonar.projectKey=logday-server
sonar.projectName=logday-server

sonar.sources=.
sonar.exclusions=**/*_test.go,web/dist/**,specs/**,data/**,.sonar/**,.trivycache/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
